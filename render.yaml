services:
  - type: web
    name: babil
    env: node
    plan: starter
    # `postinstall` exécute `prisma generate` ; au démarrage : `migrate deploy` + seed pays puis Next.
    buildCommand: npm install && npm run build
    startCommand: npm run start:render
    autoDeploy: true

  - type: worker
    name: babil-agents
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm run db:migrate-deploy && npm run agents:start
    autoDeploy: true
