# Collecte World Bank + matérialisation vers `full_data`.
# Requis : secret repository `DATABASE_URL` (PostgreSQL Babil).
# Applique d'abord les migrations Prisma (`dedupeKey`, queue jobs) puis seed + run.
# Évite les limites de durée des fonctions serverless pour les gros runs.

name: Intelligence pipeline (weekly)

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply pending Prisma migrations
        run: npm run db:migrate-deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Seed intelligence sources
        run: npm run intelligence:seed-sources
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: World Bank collect + materialize
        run: npm run intelligence:world-bank:materialize
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
