name: Deploy and Trigger Agents

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Keep agent worker refreshed even when nobody pushes.
    - cron: "0 */6 * * *"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render web deploy
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          DEPLOY_HOOK_URL="$(jq -r '.RENDER_WEB_DEPLOY_HOOK_URL // empty' <<< "$SECRETS_JSON")"
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$DEPLOY_HOOK_URL"
          fi

      - name: Trigger Render agent deploy
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          DEPLOY_HOOK_URL="$(jq -r '.RENDER_AGENT_DEPLOY_HOOK_URL // empty' <<< "$SECRETS_JSON")"
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$DEPLOY_HOOK_URL"
          fi

      - name: Trigger Vercel deploy
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          DEPLOY_HOOK_URL="$(jq -r '.VERCEL_DEPLOY_HOOK_URL // empty' <<< "$SECRETS_JSON")"
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            curl -fsS -X POST "$DEPLOY_HOOK_URL"
          fi
