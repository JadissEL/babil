name: Deploy and Trigger Agents

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Keep agent worker refreshed even when nobody pushes.
    - cron: "0 */6 * * *"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render web deploy
        if: ${{ secrets.RENDER_WEB_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_WEB_DEPLOY_HOOK_URL }}"

      - name: Trigger Render agent deploy
        if: ${{ secrets.RENDER_AGENT_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "${{ secrets.RENDER_AGENT_DEPLOY_HOOK_URL }}"

      - name: Trigger Vercel deploy
        if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
