name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_babil_ci_placeholder
      CLERK_SECRET_KEY: sk_test_babil_ci_placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma migrate (CI Postgres)
        run: npx prisma migrate deploy

      - name: Seed countries from data/countries.json
        run: npm run seed

      - name: Launch gate — public information bar
        run: npm run launch:gate:public:ci

      - name: Dependency audit (production, critical threshold)
        run: npm run audit:ci

      - name: Lint
        run: npm run lint

      - name: Prettier (check — API + types)
        run: npm run format:check

      - name: Build committed agent manifest URL map
        run: npm run agent:manifest-build-committed

      - name: Validate agent manifest URL map parity
        run: npm run agent:manifest-validate

      - name: Validate intelligence taxonomy ↔ glossary
        run: npm run intelligence:validate-taxonomy

      - name: Unit tests (lib, tsx)
        run: npm run test:lib

      - name: Unit tests (Vitest — routes critiques)
        run: npm run test:vitest

      - name: Build
        run: npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: quality
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_babil_ci_placeholder
      CLERK_SECRET_KEY: sk_test_babil_ci_placeholder
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run seed
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Start Next.js and run smoke tests
        run: |
          npm run start &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3000/api/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/api/health
          npm run test:smoke:objectives -- http://127.0.0.1:3000
          npm run test:smoke:stitch -- http://127.0.0.1:3000
